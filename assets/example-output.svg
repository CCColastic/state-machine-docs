<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">Example architecture explorer output</title>
  <desc id="desc">A preview of the standalone architecture explorer generated for CampusMind Agent, with layer navigation, grouped and flat controls, an architecture diagram, and linked source evidence.</desc>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#d7dde6"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#64748b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity=".08"/></filter>
  </defs>
  <rect width="1440" height="1000" fill="#f5f7fa"/>
  <rect width="280" height="1000" fill="#fff"/>
  <path d="M279.5 0v1000" stroke="#d9e0e9"/>
  <text x="30" y="52" font-family="system-ui,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#1e293b">CampusMind Agent</text>
  <text x="30" y="82" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#475569">Architecture &amp; state machines</text>
  <text x="30" y="130" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#64748b">DOCUMENTATION LAYERS</text>
  <rect x="18" y="150" width="244" height="55" rx="7" fill="#eaf0fc"/>
  <text x="32" y="174" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="650" fill="#1d4ed8">Application architecture</text>
  <text x="32" y="192" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#475569">Architecture</text>
  <g font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#334155">
    <text x="32" y="242">Agent runtime routing</text><text x="32" y="292">Conversation and streamed reply</text>
    <text x="32" y="342">Agent plan retry lifecycle</text><text x="32" y="392">Layered conversation memory</text>
    <text x="32" y="442">Knowledge retrieval</text><text x="32" y="492">Tool job lifecycle</text>
    <text x="32" y="542">Risk case lifecycle</text><text x="32" y="592">Human response review</text>
    <text x="32" y="642">Operational alerts</text>
  </g>
  <text x="30" y="950" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#64748b">Grouped and flat views preserve transitions.</text>

  <g font-family="system-ui,Segoe UI,sans-serif">
    <text x="322" y="45" font-size="12" font-weight="700" letter-spacing="1.2" fill="#64748b">ARCHITECTURE</text>
    <rect x="1260" y="22" width="142" height="32" rx="16" fill="#fff" stroke="#d9e0e9"/>
    <text x="1281" y="43" font-size="12" fill="#475569">Source snapshot</text>
    <text x="322" y="96" font-size="34" font-weight="700" fill="#1e293b">Application architecture</text>
    <text x="322" y="128" font-size="14" fill="#475569">FastAPI accepts authenticated student messages. The agent runtime prepares a response, then separate services</text>
    <text x="322" y="150" font-size="14" fill="#475569">persist reports and traces while governed tool jobs run after reply generation.</text>

    <rect x="308" y="178" width="1110" height="526" rx="12" fill="#fff" stroke="#d9e0e9" filter="url(#shadow)"/>
    <path d="M309 236h1108" stroke="#d9e0e9"/>
    <rect x="328" y="192" width="96" height="36" rx="7" fill="#1e293b"/>
    <text x="348" y="216" font-size="13" font-weight="600" fill="#fff">Grouped</text>
    <rect x="432" y="192" width="76" height="36" rx="7" fill="#fff" stroke="#d9e0e9"/>
    <text x="449" y="216" font-size="13" fill="#1e293b">Flat</text>
    <g fill="#fff" stroke="#d9e0e9">
      <rect x="1103" y="192" width="38" height="36" rx="7"/><rect x="1147" y="192" width="38" height="36" rx="7"/>
      <rect x="1227" y="192" width="95" height="36" rx="7"/><rect x="1330" y="192" width="72" height="36" rx="7"/>
    </g>
    <g font-size="17" fill="#1e293b"><text x="1116" y="216">−</text><text x="1160" y="216">+</text></g>
    <text x="1190" y="215" font-size="12" fill="#475569">100%</text><text x="1241" y="215" font-size="12" fill="#1e293b">Fit width</text><text x="1341" y="215" font-size="12" fill="#1e293b">Expand</text>
    <rect x="309" y="237" width="1108" height="432" fill="url(#dots)"/>

    <g fill="#eef3ff" stroke="#a9bce8" stroke-width="1.4">
      <rect x="340" y="280" width="140" height="56" rx="10"/><rect x="525" y="280" width="150" height="56" rx="10"/>
      <rect x="720" y="280" width="152" height="56" rx="10"/><rect x="920" y="270" width="180" height="78" rx="10"/>
      <rect x="1162" y="270" width="194" height="78" rx="10"/>
      <rect x="719" y="414" width="152" height="56" rx="10"/><rect x="920" y="414" width="180" height="56" rx="10"/>
      <rect x="1160" y="405" width="196" height="74" rx="10"/>
      <rect x="719" y="550" width="152" height="56" rx="10"/><rect x="920" y="550" width="180" height="56" rx="10"/>
      <rect x="1160" y="550" width="196" height="56" rx="10"/>
    </g>
    <g font-size="13" font-weight="600" text-anchor="middle" fill="#1e293b">
      <text x="410" y="314">Student browser</text><text x="600" y="314">FastAPI routes</text>
      <text x="796" y="314">ChatService</text><text x="1010" y="302">Agent harness</text><text x="1259" y="302">Agent runtime</text>
      <text x="795" y="448">Layered memory</text><text x="1010" y="448">Knowledge retrieval</text><text x="1258" y="438">Risk assessment</text>
      <text x="795" y="584">SQL database</text><text x="1010" y="584">Redis cache</text><text x="1258" y="584">Chroma index</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)">
      <path d="M480 308h42"/><path d="M675 308h40"/><path d="M872 308h43"/><path d="M1100 308h56"/>
      <path d="M1258 349v42l-245 20"/><path d="M1250 348v48l10 8"/>
      <path d="M1010 349v58"/><path d="M796 349v58"/>
      <path d="M795 471v70"/><path d="M1010 471v70"/><path d="M1258 480v60"/>
    </g>
    <g font-size="11" fill="#475569" text-anchor="middle">
      <text x="502" y="296">request</text><text x="695" y="296">chat</text><text x="895" y="296">run</text>
      <text x="1126" y="296">prepare</text><text x="805" y="523">read/write</text>
    </g>
    <rect x="328" y="677" width="12" height="12" rx="6" fill="#cbd5e1"/>
    <text x="348" y="688" font-size="11" fill="#475569">Scroll to explore. Grouped and Flat retain the same states and transitions.</text>

    <g>
      <rect x="308" y="728" width="1110" height="88" rx="9" fill="#fff" stroke="#d9e0e9"/>
      <text x="332" y="759" font-size="16" font-weight="650" fill="#1e293b">Agent runtime routing</text>
      <text x="332" y="785" font-size="13" fill="#475569">The controller selects the next node from shared run state. CHAT uses Companion; CONSULT and RISK use the support path.</text>
      <text x="1363" y="777" font-size="20" fill="#1d4ed8">›</text>
    </g>
    <text x="322" y="868" font-size="21" font-weight="700" fill="#1e293b">Behavior and boundaries</text>
    <rect x="308" y="888" width="1110" height="88" rx="9" fill="#fff" stroke="#d9e0e9"/>
    <text x="332" y="919" font-size="15" font-weight="650" fill="#1e293b">Source evidence</text>
    <text x="332" y="946" font-size="13" fill="#1d4ed8">app/main.py · create_app</text>
    <text x="554" y="946" font-size="13" fill="#475569">Expand a symbol to inspect the included source excerpt.</text>
  </g>
</svg>
